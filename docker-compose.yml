services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pm_tool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DB_ENGINE: postgres
      DB_NAME: pm_tool
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  pgdata:
